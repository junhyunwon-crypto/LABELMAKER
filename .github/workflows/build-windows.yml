name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "labelmaker_windows.py"
      - "requirements-windows.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-windows.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt

      - name: Run self-test
        run: python labelmaker_windows.py --self-test

      - name: Build EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name BarcodeMaker_BFV4T_ZMODE
          --hidden-import win32timezone
          --hidden-import xlrd
          --collect-all reportlab
          labelmaker_windows.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeMaker_BFV4T_ZMODE
          path: dist/BarcodeMaker_BFV4T_ZMODE.exe
          if-no-files-found: error
          retention-days: 30
